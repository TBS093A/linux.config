# tmux.conf - keeps the default C-b prefix (no muscle-memory disruption),
# adds vim-style pane handling and a statusbar in the same palette as
# welcome.sh (gray 244 for labels/gray, green 2 for the accent) so the
# terminal reads as one consistent look end to end.

set -g mouse on
set -g history-limit 10000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# splits that keep the current pane's working directory, with more
# mnemonic keys than tmux's default % and "
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation/resize (prefix + hjkl / HJKL)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi keys in copy-mode (Space to start selection, y to copy, matching vim)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# reload this file without restarting the server
bind r source-file "$HOME/.tmux.conf" \; display-message "tmux.conf reloaded"

# --- statusbar, welcome.sh palette (gray 244 / green accent 2) ---
set -g status-style "fg=colour244,bg=default"
set -g status-left-length 30
set -g status-left "#[fg=colour2,bold] #S #[fg=colour244]│ "
set -g status-right "#[fg=colour244]%Y-%m-%d %H:%M #[fg=colour2,bold]#h "
setw -g window-status-current-format "#[fg=colour2,bold]#I:#W#F"
setw -g window-status-format "#[fg=colour244]#I:#W#F"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour2"
