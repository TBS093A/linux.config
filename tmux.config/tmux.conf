# tmux.conf - keeps the default C-b prefix (no muscle-memory disruption),
# adds vim-style pane handling and a statusbar in the same palette as
# welcome.sh/zsh.config/palette.zsh (gray 244 for labels, green 2 for the
# accent) so the terminal reads as one consistent look end to end. tmux
# config isn't shell, so this can't source palette.zsh directly - keep
# these numbers in sync with it by hand if the palette ever changes.

set -g mouse on
set -g history-limit 10000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# splits that keep the current pane's working directory, with more
# mnemonic keys than tmux's default % and "
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation/resize (prefix + hjkl / HJKL)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi keys in copy-mode (Space to start selection, y to copy, matching vim)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# reload this file without restarting the server
bind r source-file "$HOME/.tmux.conf" \; display-message "tmux.conf reloaded"

# --- statusbar, welcome.sh palette (gray 244 / green accent 2) ---
# status-interval is lowered from tmux's 15s default to 10s to match
# status-sys.sh's refresh cadence explicitly, rather than leaving readers
# to guess how often it's polling CPU/RAM/GPU.
set -g status-interval 10
set -g status-style "fg=colour244,bg=default"
set -g status-left-length 30
set -g status-left "#[fg=colour2,bold] #S #[fg=colour244]│ "
set -g status-right "#($HOME/.tmux/status-sys.sh)#[fg=colour244] │ %Y-%m-%d %H:%M #[fg=colour2,bold]#h "
setw -g window-status-current-format "#[fg=colour2,bold]#I:#W#F"
setw -g window-status-format "#[fg=colour244]#I:#W#F"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour2"

# --- plugins (TPM - see install.sh for the bootstrap/headless-install step).
# No tmux-resurrect/tmux-continuum here - tmux.session.sh (tmux-session
# save/restore) is this repo's own take on that, with full pane-level
# restore (cwd, command, exact layout, active window/pane), not just tmux-
# yank's unrelated clipboard integration. ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

run '$HOME/.tmux/plugins/tpm/tpm'
