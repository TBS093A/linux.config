name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (bash scripts)
        run: |
          shellcheck --shell=bash \
            install.sh \
            make.symlinks.sh \
            help-cmd.sh \
            sshd.ssh.config/welcome.sh \
            tmux.config/tmux.session.sh \
            zsh.config/install.zsh.plugins.sh \
            zsh.config/install.zsh.sh \
            bash.config/.bashrc \
            bash.config/.bash_profile \
            test/welcome-smoke.sh

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: bash -n
        run: |
          for f in install.sh make.symlinks.sh help-cmd.sh sshd.ssh.config/welcome.sh \
                   tmux.config/tmux.session.sh zsh.config/install.zsh.plugins.sh \
                   zsh.config/install.zsh.sh bash.config/.bashrc bash.config/.bash_profile \
                   test/welcome-smoke.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: zsh -n
        run: |
          for f in get.package.manager.zsh vpn.config/connect.sh vpn.config/disconnect.sh \
                   zsh.config/.zshrc zsh.config/palette.zsh zsh.config/lambda-00x097.zsh-theme \
                   sshd.ssh.config/welcome.sh; do
            echo "zsh -n $f"
            zsh -n "$f"
          done
